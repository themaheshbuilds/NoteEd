{% extends "base.html" %}

{% block title %}Login - NoteEd{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 sm:my-14 px-4">
    <div class="glass-card p-6 sm:p-10 rounded-3xl border border-white/20 shadow-2xl relative overflow-hidden">
        <!-- Ambient Radial Light -->
        <div class="absolute -top-20 -right-20 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="flex flex-col items-center justify-center mb-8">
            <img src="{{ url_for('static', filename='images/noteedhalf.png') }}" alt="NoteEd Logo" class="h-12 w-auto mb-3 drop-shadow-md">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-center font-outfit" style="color: var(--text-primary);">
                Welcome Back
            </h2>
            <p class="text-xs mt-1 text-center" style="color: var(--text-secondary);">
                Log in to continue your AI-powered study sessions
            </p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-5">
            <div>
                <label for="email" class="block text-xs font-bold uppercase tracking-wider mb-2" style="color: var(--text-secondary);">Email Address</label>
                <div class="relative">
                    <input type="email" id="email" name="email" required placeholder="name@example.com"
                        class="w-full px-4 py-3 rounded-xl focus:outline-none transition text-sm"
                        style="background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary);"
                        aria-label="Email address">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider" style="color: var(--text-secondary);">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}"
                        class="text-xs text-blue-500 hover:underline font-semibold focus:outline-none rounded">Forgot Password?</a>
                </div>
                <div class="relative">
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        class="w-full px-4 py-3 rounded-xl focus:outline-none transition text-sm"
                        style="background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary);"
                        aria-label="Password">
                </div>
            </div>

            <button type="submit"
                class="w-full py-3.5 rounded-full font-bold text-sm text-white transition-all shadow-md mt-2 flex items-center justify-center gap-2 hover:opacity-95"
                style="background: var(--accent-gradient); box-shadow: 0 4px 15px var(--accent-glow);">
                <span>Sign In</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="my-6 relative">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t" style="border-color: var(--border);"></div>
            </div>
            <div class="relative flex justify-center text-xs">
                <span class="px-3 rounded-full text-[10px] font-bold uppercase tracking-wider" style="background: var(--card); color: var(--text-muted);">OR</span>
            </div>
        </div>

        <a href="{{ url_for('auth.google_login') }}"
            class="flex items-center justify-center w-full py-3 rounded-full border transition-all text-xs font-bold gap-3 shadow-sm hover:bg-black/5 dark:hover:bg-white/5"
            style="background: var(--bg-elevated); border-color: var(--border); color: var(--text-primary);"
            aria-label="Continue with Google">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Continue with Google
        </a>

        <p class="mt-6 text-center text-xs" style="color: var(--text-secondary);">
            Don't have an account? 
            <a href="{{ url_for('auth.signup') }}" class="text-blue-500 font-bold hover:underline">Create free account</a>
        </p>
    </div>
</div>
{% endblock %}
